# Install in /etc/nginx/sites-available and link from sites-enabled (http context).
# This file defines the shared limiter and keeps port 3201 as a redirect only.
# The application is served at https://hermoscare.com/melissa through the existing
# HTTPS vhost, using melissa.nginx.locations.conf and melissa-proxy.conf.
# In .env.preview, APP_ORIGIN=https://hermoscare.com and COOKIE_SECURE=true.
# Build and run the application with NEXT_PUBLIC_BASE_PATH=/melissa.

# Only bootstrap consumes this bucket. Empty keys skip rate limiting for pages,
# static assets, and normal practice requests. Client identity comes from the TCP
# peer, not client-supplied X-Forwarded-For headers. No upstream proxy is trusted.
map $uri $melissa_bootstrap_key {
    default "";
    /api/v1/bootstrap $binary_remote_addr;
    /api/v1/bootstrap/ $binary_remote_addr;
    /melissa/api/v1/bootstrap $binary_remote_addr;
    /melissa/api/v1/bootstrap/ $binary_remote_addr;
}
limit_req_zone $melissa_bootstrap_key zone=melissa_bootstrap_per_ip:10m rate=10r/m;

server {
    listen 3201 ssl;
    listen [::]:3201 ssl;
    server_name hermoscare.com;

    ssl_certificate /etc/letsencrypt/live/www.hermoscare.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.hermoscare.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MelissaTLS:1m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;

    # A server_name alone would accept unknown hosts on this unique port.
    if ($http_host != "hermoscare.com:3201") {
        return 421;
    }

    # Canonical HTTPS uses the already reachable port 443. Redirect before the
    # application so a former 3201 tab cannot send an incompatible Origin.
    location = / {
        return 308 https://hermoscare.com/melissa$is_args$args;
    }

    location / {
        return 308 https://hermoscare.com$request_uri;
    }
}
