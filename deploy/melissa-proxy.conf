# Include only inside the /melissa exact and /melissa/ prefix locations.
# No URI suffix on proxy_pass: preserve Next's build-time /melissa basePath.
proxy_pass http://127.0.0.1:3200;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Forwarded "";
# Origin passes unchanged so the application remains responsible for CSRF checks.
# Forwarded client addresses are replaced with the TCP peer, not appended to an
# untrusted client header. Revisit this only when adding a trusted upstream proxy.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 120s;
proxy_buffering off;
proxy_intercept_errors off;

client_max_body_size 16k;
client_body_timeout 15s;
send_timeout 30s;
keepalive_timeout 30s;
limit_req zone=melissa_bootstrap_per_ip burst=20 nodelay;
limit_req_status 429;
limit_req_log_level warn;
error_page 413 = @melissa_body_too_large;
error_page 429 = @melissa_rate_limited;

# Keep the existing site's HSTS while taking other response security headers
# from Next. Defining this locally prevents inheriting the host's SAMEORIGIN
# header alongside Melissa's stricter DENY header.
add_header Strict-Transport-Security "max-age=31536000" always;
