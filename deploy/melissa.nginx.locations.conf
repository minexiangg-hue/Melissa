# Install as /etc/nginx/snippets/melissa.nginx.locations.conf and include ONCE
# inside the existing hermoscare.com/www.hermoscare.com HTTPS (443) server block.
# Keep the existing HTTP/ACME, root location, and all unrelated vhosts unchanged.
# melissa.nginx.conf must also be loaded in http context for the shared limiter.

# Proxy both forms and let Next handle slash normalization. Redirecting the
# exact path to /melissa/ here would loop with Next's default trailingSlash=false.
location = /melissa {
    if ($host != "hermoscare.com") {
        return 308 https://hermoscare.com$request_uri;
    }
    include /etc/nginx/snippets/melissa-proxy.conf;
}

location ^~ /melissa/ {
    if ($host != "hermoscare.com") {
        return 308 https://hermoscare.com$request_uri;
    }
    include /etc/nginx/snippets/melissa-proxy.conf;
}

# Named locations belong at server scope. Only the Melissa proxy references
# them; the host site's existing error handling and main location stay intact.
location @melissa_body_too_large {
    default_type application/json;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    return 413 '{"error":{"code":"VALIDATION","message":"Request body is too large."}}';
}

location @melissa_rate_limited {
    default_type application/json;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "6" always;
    return 429 '{"error":{"code":"RATE_LIMITED","message":"Too many refreshes. Please wait a moment and try again."}}';
}
